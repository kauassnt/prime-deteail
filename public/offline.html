<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#FFFBF7" />
    <title>PK Detail — Sem conexão</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #fffbf7;
        color: #171717;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 380px;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        display: block;
        margin: 0 auto 20px;
      }
      h1 {
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 0 0 8px;
      }
      p {
        font-size: 13px;
        line-height: 1.6;
        color: #64748b;
        margin: 0 0 22px;
      }
      a.button {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        width: 100%;
        border-radius: 14px;
        background: #ea580c;
        color: #fff;
        font-size: 13px;
        font-weight: 800;
        text-decoration: none;
      }
      a.button:active {
        transform: scale(0.99);
      }
      .hint {
        margin-top: 14px;
        font-size: 11px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="PK Detail" />
      <h1>Você está sem conexão</h1>
      <p>
        O PK Detail precisa de internet para carregar os dados da operação. Verifique sua rede e
        tente novamente.
      </p>
      <a class="button" href="/">Tentar novamente</a>
      <p class="hint">Nenhum dado sensível é armazenado durante o modo offline.</p>
    </main>
  </body>
</html>
