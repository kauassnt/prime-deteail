<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A3412" />
      <stop offset="60%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFEDD5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border ring -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#F97316" stroke-opacity="0.3" stroke-width="4" />
  
  <!-- Sleek motorcycle / shield graphic -->
  <g transform="translate(76, 88)" fill="none" stroke="url(#metalGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wheel Left (rear) -->
    <circle cx="60" cy="240" r="48" stroke-width="22" stroke="#FFFFFF" />
    <circle cx="60" cy="240" r="16" fill="#FFFFFF" />
    <circle cx="60" cy="240" r="32" stroke-width="4" stroke="#FFEDD5" stroke-dasharray="6,6" />
    
    <!-- Wheel Right (front) -->
    <circle cx="300" cy="240" r="48" stroke-width="22" stroke="#FFFFFF" />
    <circle cx="300" cy="240" r="16" fill="#FFFFFF" />
    <circle cx="300" cy="240" r="32" stroke-width="4" stroke="#FFEDD5" stroke-dasharray="6,6" />
    
    <!-- Motorcycle Chassis / Tank / Fairing line -->
    <path d="M 60 240 L 130 170 L 190 170 L 230 110 L 270 110 L 300 240" stroke-width="24" stroke="#FFFFFF" />
    <!-- Fork & Handlebar -->
    <path d="M 230 110 L 260 70 M 245 70 L 285 70" stroke-width="20" stroke="#FFEDD5" />
    <!-- Seat & Tail -->
    <path d="M 90 170 Q 150 160 170 190 L 130 240" stroke-width="18" stroke="#FFFFFF" />
    <!-- Engine / Detailing Sparkle Block -->
    <path d="M 160 200 L 220 200 L 210 240 L 150 240 Z" fill="#FFEDD5" fill-opacity="0.8" stroke-width="6" />
  </g>
  
  <!-- Detailing Sparkle (4-point star) -->
  <path d="M 390 100 Q 410 120 430 120 Q 410 120 390 140 Q 370 120 350 120 Q 370 120 390 100 Z" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="390" cy="120" r="4" fill="#9A3412" />

  <!-- Tiny sparkle -->
  <path d="M 120 90 Q 130 100 140 100 Q 130 100 120 110 Q 110 100 100 100 Q 110 100 120 90 Z" fill="#FFEDD5" />

  <!-- Lower Brand Text 'PK' -->
  <text x="256" y="420" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="48" font-weight="900" letter-spacing="10" fill="#FFFFFF">PK</text>
  <text x="256" y="455" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="12" fill="#FFEDD5">DETAIL</text>
</svg>
